apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: supply-chain-backend
  template:
    metadata:
      labels:
        app: supply-chain-backend
    spec:
      containers:
      - name: backend
        image: supply-chain-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: host
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: supply-chain-backend-service
spec:
  selector:
    app: supply-chain-backend
  ports:
  - port: 3001
    targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-chain-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-chain-frontend
  template:
    metadata:
      labels:
        app: supply-chain-frontend
    spec:
      containers:
      - name: frontend
        image: supply-chain-frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"