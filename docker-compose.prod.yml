version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supply-chain-postgres
    environment:
      POSTGRES_DB: supply_chain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - supply-chain-network

  redis:
    image: redis:7-alpine
    container_name: supply-chain-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - supply-chain-network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: supply-chain-backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - supply-chain-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: supply-chain-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - supply-chain-network

volumes:
  postgres_data:
  redis_data:

networks:
  supply-chain-network:
    driver: bridge