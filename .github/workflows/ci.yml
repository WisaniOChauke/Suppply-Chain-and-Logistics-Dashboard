name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint frontend
      run: cd apps/frontend && npm run lint
    
    - name: Test frontend
      run: cd apps/frontend && npm test -- --passWithNoTests --watchAll=false
    
    - name: Test backend
      run: cd apps/backend && npm test -- --passWithNoTests --watchAll=false
    
    - name: Build frontend
      run: cd apps/frontend && npm run build
    
    - name: Build backend
      run: cd apps/backend && npm run build
    
    - name: Type check
      run: |
        cd apps/frontend && npx tsc --noEmit
        cd ../backend && npx tsc --noEmit

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy to production
      run: |
        echo "All checks passed - deploying to production"
        echo "Frontend build: ✅"
        echo "Backend build: ✅"
        echo "Tests: ✅"
        echo "Linting: ✅"